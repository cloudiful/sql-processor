[workspace]
resolver = "2"
members = [
    "crates/sql-processor-core",
    "crates/sql-processor-validation",
    "crates/sql-processor-api",
    "crates/sql-processor-cli",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
authors = ["Cloudiful"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
bytes = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
encoding_rs = "0.8.41"
oracle-rs = "0.1.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
